<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>PeerDrop</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=Jacquard+24&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--accent:#f5c842;--ok:#4ade80}
  body{background:#111;font-family:'DM Sans',sans-serif;min-height:100dvh;color:#fff;display:flex;flex-direction:column;align-items:center;padding:32px 24px}
  .wrap{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center}
  .logo{font-family:'Jacquard 24',system-ui;font-size:34px;letter-spacing:-0.02em;margin-bottom:6px}
  .logo span{color:var(--accent)}
  .subtitle{font-size:13px;color:#666;margin-bottom:20px;text-align:center}
  #status{display:flex;align-items:center;gap:8px;font-size:12px;color:#888;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;padding:7px 14px;margin-bottom:28px}
  #status::before{content:"";width:8px;height:8px;border-radius:50%;background:#555}
  #status.ok{color:var(--ok);border-color:#1f3a2a}
  #status.ok::before{background:var(--ok)}
  #status.err{color:#f87171}
  #status.err::before{background:#f87171}
  #setup,#transfer{width:100%}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
  .mode-btn{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;color:#888;font-family:inherit;font-size:12px;padding:10px 8px;cursor:pointer;text-align:center;transition:all .15s;line-height:1.4}
  .mode-btn i{font-size:18px;display:block;margin-bottom:4px}
  .mode-btn.active{border-color:var(--accent);color:var(--accent);background:#1e1c14}
  .mode-btn:active{transform:scale(.96)}
  .panel{display:none;flex-direction:column;gap:12px}
  .panel.active{display:flex}
  .step{font-size:12px;color:#666;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
  .step b{flex:none;width:20px;height:20px;border-radius:50%;background:#1e1c14;border:1px solid var(--accent);color:var(--accent);font-size:11px;display:flex;align-items:center;justify-content:center}
  textarea{width:100%;height:84px;font:11px ui-monospace,monospace;background:#1a1a1a;color:#ddd;border:1px solid #2a2a2a;border-radius:12px;padding:12px;resize:none;outline:none}
  textarea:focus{border-color:var(--accent)}
  .row{display:flex;gap:8px}
  .btn{flex:1;background:#1e1e1e;border:1px solid #333;color:#ccc;font-family:inherit;font-size:12px;padding:12px 6px;border-radius:10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn:active{transform:scale(.94);background:#2a2a2a}
  .btn.main{background:var(--accent);border-color:var(--accent);color:#111;font-family:'Jacquard 24',system-ui;font-size:22px;letter-spacing:.03em;padding:12px;border-radius:14px}
  .btn.main:active{background:#e0b530}
  .opt{margin-top:22px;font-size:12px;color:#666;display:flex;gap:8px;align-items:flex-start;cursor:pointer;line-height:1.5}
  .opt input{accent-color:var(--accent);margin-top:2px}
  #drop{width:100%;aspect-ratio:4/3;border:2px dashed #333;border-radius:20px;background:#1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:all .2s;color:#555;font-size:14px;text-align:center;line-height:1.5}
  #drop i{font-size:40px;line-height:1;color:#888}
  #drop:active,#drop.over{border-color:var(--accent);background:#1e1c14}
  #drop.over i{color:var(--accent)}
  .label{font-size:12px;color:#666;margin:22px 0 8px;display:flex;justify-content:space-between}
  .label span{color:var(--accent);font-weight:500}
  progress{width:100%;height:4px;appearance:none;-webkit-appearance:none;border:0;border-radius:2px;background:#333;margin:10px 0}
  progress::-webkit-progress-bar{background:#333;border-radius:2px}
  progress::-webkit-progress-value{background:var(--accent);border-radius:2px}
  progress::-moz-progress-bar{background:var(--accent)}
  #sendLabel{font-size:12px;color:#888}
  #received{display:flex;flex-direction:column;gap:8px}
  #received .empty{font-size:13px;color:#555;text-align:center;padding:14px}
  .item{display:flex;align-items:center;gap:12px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px 14px;font-size:13px;color:#ccc;text-decoration:none;transition:all .15s}
  .item:active{transform:scale(.97);border-color:var(--accent)}
  .item i{font-size:20px;color:var(--accent)}
  .item small{display:block;color:#666;font-size:11px;margin-top:2px}
  .item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mycode{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-weight:700;font-size:56px;letter-spacing:.14em;text-indent:.14em;color:var(--accent);text-align:center;line-height:1.1;cursor:pointer;padding:10px 0 4px;user-select:all}
  .hint{font-size:12px;color:#666;text-align:center;margin-bottom:22px}
  .divider{display:flex;align-items:center;gap:12px;color:#444;font-size:12px;margin:26px 0 18px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:#2a2a2a}
  #targetId{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;color:#fff;font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-weight:700;font-size:32px;letter-spacing:.14em;text-indent:.14em;text-align:center;padding:12px;outline:none;text-transform:uppercase;margin-bottom:12px}
  #targetId:focus{border-color:var(--accent)}
  #targetId::placeholder{color:#333}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Peer<span>Drop</span></div>
  <div class="subtitle">Zadej kód → přetáhni soubor → hotovo</div>
  <div id="status">Nepřipojeno</div>

  <div id="setup">
    <div class="hint">Tvůj kód, řekni ho druhému zařízení:</div>
    <div class="mycode" id="myCode" onclick="copyCode()">-----</div>
    <div class="hint" id="copyHint">klepnutím zkopíruješ</div>
    <div class="divider">nebo</div>
    <input id="targetId" maxlength="5" placeholder="KÓD" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="btn main" id="connectBtn">Připojit</button>
  </div>

  <div id="transfer" hidden>
    <div id="drop"><i class="bi bi-cloud-arrow-up"></i>Klepni nebo přetáhni<br>soubory k odeslání</div>
    <input type="file" id="fileInput" multiple hidden>
    <div id="sendLabel"></div>
    <progress id="sendProg" value="0" max="100" hidden></progress>
    <div class="label"><span style="color:#666;font-weight:400">Přijaté soubory</span></div>
    <progress id="recvProg" value="0" max="100" hidden></progress>
    <div id="received"><div class="empty">Zatím nic.</div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const CHUNK = 16 * 1024, HIGH = 4 * 1024 * 1024;
const fmt = b => b > 1e6 ? (b/1e6).toFixed(1)+' MB' : (b/1e3).toFixed(0)+' kB';
const setStatus = (t, c='') => { $('status').textContent = t; $('status').className = c; };
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from({length:5}, () => ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');

// STUN + TURN relé (TURN zajistí spojení i přes přísné NAT / mobilní sítě)
const ICE = [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] },
  { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
  { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turns:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' }
];
const BROKER = 'wss://broker.hivemq.com:8884/mqtt';   // signalizace přes WebSocket (port 443-like, prochází většinou sítí)
const T = c => `peerdrop/v1/${c}`;

const myId = Math.random().toString(36).slice(2, 10);
const myCode = genCode();
let mq, pc = null, dc = null, role = '', outTopic = '', remoteId = '', pending = [];
const pub = (topic, obj) => mq.publish(topic, JSON.stringify(obj), { qos: 1 });

function copyCode() {
  navigator.clipboard?.writeText(myCode);
  $('copyHint').textContent = 'zkopírováno ✓';
  setTimeout(() => $('copyHint').textContent = 'klepnutím zkopíruješ', 1500);
}

// ── Signalizace ──
setStatus('Připojuji k síti…');
mq = mqtt.connect(BROKER, { clientId: 'pd-' + myId, connectTimeout: 8000, reconnectPeriod: 2000 });
mq.on('connect', () => {
  mq.subscribe(T(myCode) + '/in', { qos: 1 });
  $('myCode').textContent = myCode;
  if (!pc) setStatus('Čekám na spojení');
});
mq.on('offline', () => { if (!pc || pc.connectionState !== 'connected') setStatus('Signalizační server nedostupný, zkontroluj internet', 'err'); });
mq.on('error', () => setStatus('Signalizační server nedostupný', 'err'));
mq.on('message', (topic, buf) => {
  let m; try { m = JSON.parse(buf.toString()); } catch { return; }
  onSignal(topic, m);
});

function makePC(r) {
  if (pc) { try { pc.close(); } catch {} }
  role = r; pending = [];
  pc = new RTCPeerConnection({ iceServers: ICE });
  const mine = pc;
  pc.onicecandidate = e => { if (e.candidate && mine === pc) pub(outTopic, { t: 'ice', from: myId, c: e.candidate }); };
  pc.onconnectionstatechange = () => {
    if (mine !== pc) return;
    const s = pc.connectionState;
    if (s === 'connected') setStatus('Propojeno', 'ok');
    else if (s === 'failed') { setStatus('Spojení selhalo, zkus to znovu', 'err'); $('connectBtn').disabled = false; }
    else if (s === 'disconnected') setStatus('Odpojeno', 'err');
  };
}
async function flush() { for (const c of pending) await pc.addIceCandidate(c).catch(() => {}); pending = []; }
function addCand(c) { if (pc && pc.remoteDescription) pc.addIceCandidate(c).catch(() => {}); else pending.push(c); }

async function onSignal(topic, m) {
  try {
    if (topic.endsWith('/in')) {                    // jsem "hostitel"
      if (m.t === 'offer') {
        if (role === 'caller' && pc) return;         // sám se připojuji jinam
        if (pc && pc.connectionState === 'connected') return;
        remoteId = m.from; outTopic = T(myCode) + '/r/' + m.from;
        makePC('host');
        pc.ondatachannel = e => { dc = e.channel; setupDC(); };
        setStatus('Připojuji…');
        await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp }); await flush();
        const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
        pub(outTopic, { t: 'answer', from: myId, sdp: ans.sdp });
      } else if (m.t === 'ice' && m.from === remoteId) addCand(m.c);
    } else if (role === 'caller' && pc) {           // odpověď pro volajícího
      if (m.t === 'answer') { await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }); await flush(); }
      else if (m.t === 'ice') addCand(m.c);
    }
  } catch (e) { console.error(e); }
}

$('targetId').addEventListener('input', e => e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''));
$('targetId').addEventListener('keydown', e => e.key === 'Enter' && $('connectBtn').click());
$('connectBtn').onclick = async () => {
  const code = $('targetId').value.trim();
  if (code.length < 5) return setStatus('Zadej celý kód (5 znaků)', 'err');
  if (code === myCode) return setStatus('To je tvůj vlastní kód', 'err');
  if (!mq.connected) return setStatus('Nejsem připojen k signalizaci, zkus za chvíli', 'err');
  $('connectBtn').disabled = true; setStatus('Připojuji…');
  await new Promise(r => mq.subscribe(T(code) + '/r/' + myId, { qos: 1 }, r));
  outTopic = T(code) + '/in';
  makePC('caller');
  const mine = pc;
  dc = pc.createDataChannel('files'); setupDC();
  const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
  pub(outTopic, { t: 'offer', from: myId, sdp: offer.sdp });
  setTimeout(() => {
    if (mine === pc && pc.connectionState !== 'connected') {
      setStatus(pc.signalingState === 'have-local-offer'
        ? 'Druhé zařízení neodpovídá. Zkontroluj kód a že má otevřenou stránku.'
        : `Nepodařilo se spojit (${pc.iceConnectionState}). Zkus to znovu.`, 'err');
      $('connectBtn').disabled = false; role = ''; try { pc.close(); } catch {} pc = null;
    }
  }, 25000);
};

// ── Přenos ──
let meta = null, chunks = [], got = 0;
function setupDC() {
  dc.binaryType = 'arraybuffer';
  dc.bufferedAmountLowThreshold = 1024 * 1024;
  dc.onopen = () => { $('setup').hidden = true; $('transfer').hidden = false; setStatus('Propojeno', 'ok'); };
  dc.onclose = () => setStatus('Spojení ukončeno', 'err');
  dc.onmessage = e => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.t === 'meta') { meta = m; chunks = []; got = 0; $('recvProg').hidden = false; $('recvProg').value = 0; }
      else if (m.t === 'end') {
        const url = URL.createObjectURL(new Blob(chunks, { type: meta.type }));
        const box = $('received');
        box.querySelector('.empty')?.remove();
        const a = document.createElement('a');
        a.className = 'item'; a.href = url; a.download = meta.name;
        a.innerHTML = '<i class="bi bi-download"></i><span><span></span><small></small></span>';
        a.querySelector('span span').textContent = meta.name;
        a.querySelector('small').textContent = fmt(meta.size);
        box.appendChild(a);
        $('recvProg').hidden = true; chunks = [];
      }
    } else {
      chunks.push(e.data); got += e.data.byteLength;
      $('recvProg').value = got / meta.size * 100;
    }
  };
}

async function sendFiles(files) {
  for (const f of files) {
    $('sendLabel').textContent = `Odesílám ${f.name}…`;
    $('sendProg').hidden = false;
    dc.send(JSON.stringify({ t: 'meta', name: f.name, size: f.size, type: f.type }));
    for (let o = 0; o < f.size; o += CHUNK) {
      if (dc.bufferedAmount > HIGH) await new Promise(r => { dc.onbufferedamountlow = () => { dc.onbufferedamountlow = null; r(); }; });
      dc.send(await f.slice(o, o + CHUNK).arrayBuffer());
      $('sendProg').value = Math.min(o + CHUNK, f.size) / f.size * 100;
    }
    dc.send(JSON.stringify({ t: 'end' }));
    $('sendLabel').textContent = `✓ ${f.name} odesláno`;
  }
  $('sendProg').hidden = true;
}

const drop = $('drop');
drop.onclick = () => $('fileInput').click();
$('fileInput').onchange = e => { sendFiles([...e.target.files]); e.target.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); sendFiles([...e.dataTransfer.files]); };
</script>
</body>
</html>
