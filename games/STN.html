<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Přežij noc</title>
<style>
:root{--bg:#f1ede4;--grid:#d6cfbf;--fg:#1d1b18;--panel:#fffdf8;--mut:#6b655b;--acc:#0aa37f;--line:#d9d2c3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121a;--grid:#2a2635;--fg:#f2eee6;--panel:#1f1c28;--mut:#a29cb0;--acc:#06d6a0;--line:#37324a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121a;--grid:#2a2635;--fg:#f2eee6;--panel:#1f1c28;--mut:#a29cb0;--acc:#06d6a0;--line:#37324a;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none;display:none}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-bottom:5px}
.bar i{display:block;height:100%;width:100%;background:#ef476f;transition:width .1s}
.bar.xp{height:6px}.bar.xp i{background:#ffb703}
#st{font-size:14px;font-weight:600;display:flex;justify-content:space-between;color:var(--fg)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);overflow:auto;background:color-mix(in srgb,var(--bg) 88%,transparent)}
h1{font-size:38px;margin:0;letter-spacing:-1px}h2{font-size:15px;margin:10px 0 0;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.m{color:var(--mut);margin:0;text-align:center;font-size:14px}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;width:min(340px,100%);text-align:left;cursor:pointer}
button:active{transform:scale(.98)}button:disabled{opacity:.45}
button.big{background:var(--acc);color:#04130e;font-weight:700;font-size:20px;text-align:center;border:0;padding:16px}
small{color:var(--mut)}
.bi{vertical-align:-.15em}
#pb{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 40px);width:44px;height:44px;padding:0;display:none;align-items:center;justify-content:center;border-radius:50%}
#bossbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(320px,80%);display:none;pointer-events:none;color:#ff6b00;font-weight:800;font-size:13px;text-align:center;letter-spacing:2px}
#bossbar .bar{height:12px;margin:3px 0 0;border:1px solid rgba(255,255,255,.5)}#bh{background:#ff6b00!important}
#toast{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:26px;font-weight:800;color:#ff6b00;text-shadow:0 2px 8px rgba(0,0,0,.6);opacity:0;transition:opacity .4s;pointer-events:none}
*{-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;touch-action:manipulation}
button{display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:48px;font-size:16px}
.big{font-size:20px}
h1,h2,.m{text-align:center}
#ov{text-align:center;gap:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(340px,100%)}
.grid button{width:100%;flex-direction:column;gap:2px;padding:10px 6px}
.card{flex-direction:column;gap:3px}
small{text-align:center}
.tgl{justify-content:space-between}
.stat{display:flex;gap:18px;font-size:18px;font-weight:700;justify-content:center}.stat span{display:flex;align-items:center;gap:6px}
.bi{flex:none}
#hud{padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 70px) 0 calc(env(safe-area-inset-left,0px) + 14px)}
#pb{top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 12px)}
#st{align-items:center}
#db{position:fixed;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 56px);width:68px;height:68px;min-height:0;padding:0;border-radius:50%;display:none;justify-content:center;background:conic-gradient(var(--acc) var(--c,360deg),var(--panel) 0);border:2px solid var(--line);touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="bar"><i id="hp"></i></div><div class="bar xp"><i id="xp" style="width:0"></i></div><div id="st"><span id="s1"></span><span id="s2"></span></div></div>
<button id="pb" onclick="pause()" aria-label="Pauza"></button><div id="bossbar">BOSS<div class="bar"><i id="bh"></i></div></div><div id="toast"></div>
<button id="db" onpointerdown="dash()" aria-label="Úhyb"></button>
<div id="ov"></div>

g.bl=g.bl.filter(b=>b.l>0);
p.ang+=3.2*dt;
for(let i=0;i<p.orb;i++){const a=p.ang+i*6.283/p.orb,bx=p.x+Math.cos(a)*p.orbr,by=p.y+Math.sin(a)*p.orbr;
for(const e of g.en)if(e.oc<=0&&(e.x-bx)**2+(e.y-by)**2<(e.r+p.orbs)**2){hit(e,p.dmg*.8);e.oc=.35}}

if(p.zap){p.zapT-=dt;if(p.zapT<=0){p.zapT=2.4-p.zap*.2;const c=g.en.filter(e=>(e.x-p.x)**2+(e.y-p.y)**2<360000).sort(()=>Math.random()-.5).slice(0,1+p.zap);for(const e of c){hit(e,p.dmg*2.2,1);g.zp.push({x1:p.x,y1:p.y,x2:e.x,y2:e.y,l:.15})}}}
for(const e of g.en)if(e.hp<=0){g.kills++;if(e.el||Math.random()<.012)g.hl.push({x:e.x,y:e.y});g.gm.push({x:e.x,y:e.y,v:e.xp*p.xpm,k:e.xp<1.5?0:e.xp<5?1:2});p.hp=Math.min(p.mh,p.hp+p.ls*.5);if(e.b){g.coins+=10;g.pend=1}else if(e.el)g.coins+=3;else if(Math.random()<.05+p.luck*.04)g.coins++;if(e.sp2)for(let i=0;i<2;i++)g.en.push({x:e.x+(i?9:-9),y:e.y,hp:8*(1+g.t/100),r:7,sp:95,dmg:5,c:'#ff7ac6',xp:.5,k:'c',oc:0,sl:0})}
g.en=g.en.filter(e=>e.hp>0);
for(const m of g.gm){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy)||1;if(d<p.mag){m.x+=dx/d*340*dt;m.y+=dy/d*340*dt}if(d<14){m.t=1;g.xp+=m.v}}
g.gm=g.gm.filter(m=>!m.t);g.hl=g.hl.filter(h=>{if((h.x-p.x)**2+(h.y-p.y)**2<324){p.hp=Math.min(p.mh,p.hp+p.mh*.2);sfx(660,.08);return false}return true});
for(const f of g.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt}g.fx=g.fx.filter(f=>f.l>0);
for(const o of g.rg){o.l-=dt;o.r=o.R*(1-o.l/.35)}g.rg=g.rg.filter(o=>o.l>0);for(const z of g.zp)z.l-=dt;g.zp=g.zp.filter(z=>z.l>0);for(const m of g.dm){m.y-=40*dt;m.l-=dt}g.dm=g.dm.filter(m=>m.l>0);
if(p.hp<=0){if(p.rev){p.rev=0;p.hp=p.mh*.5;p.inv=2;g.en.forEach(e=>{if(!e.b)e.hp=0})}else{die();return}}
if(g.pend){g.pend=0;levelUp(1);return}
if(g.xp>=g.need){g.xp-=g.need;g.lvl++;g.need=Math.round(g.need*1.35+3);levelUp()}
document.getElementById('hp').style.width=Math.max(0,p.hp/p.mh*100)+'%';
document.getElementById('xp').style.width=g.xp/g.need*100+'%';
{const a=ic('stopwatch-fill',14)+' '+fmt(g.t)+' &nbsp; '+ic('star-fill',14)+' '+g.lvl,b=ic('bug-fill',14)+' '+g.kills+' &nbsp; '+ic('coin',14)+' '+g.coins;if(a!==g.ha){g.ha=a;$('s1').innerHTML=a}if(b!==g.hb){g.hb=b;$('s2').innerHTML=b}}
$('db').style.setProperty('--c',(p.dc>0?(1-p.dc/p.dcd)*360:360)+'deg');const bs=g.en.find(e=>e.b);$('bossbar').style.display=bs?'block':'none';if(bs)$('bh').style.width=Math.max(0,bs.hp/(bs.mh||bs.hp)*100)+'%'}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill()}
function shape(e){const x=e.x,y=e.y,r=e.r;ctx.fillStyle=e.fl>0?'#fff':e.c;ctx.beginPath();
if(e.k==='t'){const a=e.a||0;ctx.moveTo(x+Math.cos(a)*r*1.4,y+Math.sin(a)*r*1.4);ctx.lineTo(x+Math.cos(a+2.5)*r,y+Math.sin(a+2.5)*r);ctx.lineTo(x+Math.cos(a-2.5)*r,y+Math.sin(a-2.5)*r);ctx.closePath()}
else if(e.k==='s')ctx.rect(x-r,y-r,r*2,r*2);
else if(e.k==='d'){ctx.moveTo(x,y-r*1.25);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r*1.25);ctx.lineTo(x-r,y);ctx.closePath()}
else if(e.k==='b'){for(let i=0;i<8;i++){const a=i*.785,rr=i%2?r*.75:r*1.15;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath()}
else if(e.k==='h'){for(let i=0;i<6;i++){const a=i*1.047;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r*1.15,y+Math.sin(a)*r*1.15)}ctx.closePath()}
else ctx.arc(x,y,r,0,6.283);
if(e.b){ctx.shadowColor='#ff6b00';ctx.shadowBlur=26}ctx.fill();ctx.shadowBlur=0;ctx.lineWidth=e.b?4:e.el?3:1.5;ctx.strokeStyle=e.b?'#fff':e.el?'#ffd700':'rgba(0,0,0,.55)';ctx.stroke();if(e.b){ctx.strokeStyle='rgba(255,107,0,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r*1.5+Math.sin(g.t*6)*5,0,6.283);ctx.stroke()}}
function drawP(p){const a=p.fa||0,x=p.x,y=p.y,c=Math.cos(a),n=Math.sin(a);
ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+12,13,5,0,0,6.283);ctx.fill();
ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x+c*8,y+n*8);ctx.lineTo(x+c*20,y+n*20);ctx.stroke();
ctx.strokeStyle='#333';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x+c*9,y+n*9);ctx.lineTo(x+c*19,y+n*19);ctx.stroke();
ctx.shadowColor='#06d6a0';ctx.shadowBlur=18;ctx.fillStyle='#06d6a0';ctx.beginPath();ctx.arc(x,y,14,0,6.283);ctx.fill();ctx.shadowBlur=0;
ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.stroke();ctx.lineWidth=2.5;ctx.strokeStyle='#fff';ctx.stroke();
ctx.fillStyle='#b9ffe9';ctx.beginPath();ctx.arc(x-3,y-4,6,0,6.283);ctx.fill();
ctx.fillStyle='#06d6a0';ctx.beginPath();ctx.arc(x,y,12,0,6.283);ctx.fill();
for(const q of[-1,1]){const ex=x+c*5-n*q*4.5,ey=y+n*5+c*q*4.5;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,3.6,0,6.283);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex+c*1.5,ey+n*1.5,1.9,0,6.283);ctx.fill()}}
function gem(m){const k=m.k||0,r=[5,7,10][k]*(1+.12*Math.sin(g.t*6+m.x)),c=['#ffe14d','#ffb703','#fb5607'][k];ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(m.x,m.y-r*1.3);ctx.lineTo(m.x+r*.8,m.y);ctx.lineTo(m.x,m.y+r*1.3);ctx.lineTo(m.x-r*.8,m.y);ctx.closePath();ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.stroke();ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(m.x-r*.3,m.y-r*.8,r*.25,r*.55)}
function bars(){const few=g.en.length<45;ctx.textAlign='center';for(const e of g.en){if(!e.mh||e.hp>=e.mh||!(few||e.r>=15))continue;const w=Math.max(18,e.r*2),y=e.y-e.r-(e.k==='b'?14:8);ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(e.x-w/2-1,y-1,w+2,5);ctx.fillStyle=e.b?'#ffd166':'#ff4d6d';ctx.fillRect(e.x-w/2,y,w*Math.max(0,e.hp/e.mh),3);if(e.b){ctx.fillStyle='#fff';ctx.font='bold 11px system-ui';ctx.fillText(Math.ceil(e.hp),e.x,y-3)}}}
function nums(){ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.7)';for(const m of g.dm){ctx.globalAlpha=Math.min(1,m.l*3);ctx.font=(m.c?'bold 17px':'bold 12px')+' system-ui';ctx.fillStyle=m.c?'#ffd166':'#fff';ctx.strokeText(m.v,m.x,m.y);ctx.fillText(m.v,m.x,m.y)}ctx.globalAlpha=1}
function draw(){ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);if(!g)return;
const p=g.p,cx=p.x-W/2,cy=p.y-H/2,s=64,ox=((-cx)%s+s)%s,oy=((-cy)%s+s)%s;
ctx.fillStyle=C.grid;for(let x=ox;x<W;x+=s)for(let y=oy;y<H;y+=s)ctx.fillRect(x,y,2,2);
ctx.save();ctx.translate(-cx+(g.sk>0?(Math.random()-.5)*g.sk*30:0),-cy+(g.sk>0?(Math.random()-.5)*g.sk*30:0));

for(const m of g.gm)gem(m);for(const b of g.eb){circ(b.x,b.y,6,'#fff');circ(b.x,b.y,4,'#2ec4b6')}for(const h of g.hl){circ(h.x,h.y,9,'#ff4d6d');ctx.fillStyle='#fff';ctx.fillRect(h.x-1.5,h.y-5,3,10);ctx.fillRect(h.x-5,h.y-1.5,10,3)}
for(const e of g.en)shape(e);
for(const b of g.bl)circ(b.x,b.y,4,'#fff');
for(let i=0;i<p.orb;i++){const a=p.ang+i*6.283/p.orb;circ(p.x+Math.cos(a)*p.orbr,p.y+Math.sin(a)*p.orbr,p.orbs,'#4cc9f0')}
if(p.inv<=0||Math.floor(g.t*20)%2)drawP(p);if(p.sh&&p.shT<=0){ctx.strokeStyle='#4cc9f0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,18,0,6.283);ctx.stroke()}
for(const f of g.fx)circ(f.x,f.y,2.5,'#fff');
for(const o of g.rg){ctx.strokeStyle='rgba(255,140,60,'+Math.min(1,o.l*3)+')';ctx.lineWidth=5;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,6.283);ctx.stroke()}
for(const z of g.zp){ctx.strokeStyle='#9ef0ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(z.x1,z.y1);ctx.lineTo((z.x1+z.x2)/2+(Math.random()-.5)*30,(z.y1+z.y2)/2+(Math.random()-.5)*30);ctx.lineTo(z.x2,z.y2);ctx.stroke()}
if(S.opt.hb)bars();if(S.opt.dn)nums();
ctx.restore();
if(S.opt.ind)for(const e of g.en){if(!e.b)continue;const sx=e.x-cx,sy=e.y-cy;if(sx>-20&&sx<W+20&&sy>-20&&sy<H+20)continue;const a=Math.atan2(sy-H/2,sx-W/2),ex=Math.max(30,Math.min(W-30,sx)),ey=Math.max(90,Math.min(H-60,sy));ctx.save();ctx.translate(ex,ey);ctx.rotate(a);ctx.fillStyle='#ff6b00';ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-8,-10);ctx.lineTo(-8,10);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore()}
if(p.hp<p.mh*.3){const gr=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.7);gr.addColorStop(0,'rgba(255,0,60,0)');gr.addColorStop(1,'rgba(255,0,60,'+(.25+.15*Math.sin(g.t*8))+')');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
if(joy){ctx.strokeStyle='rgba(128,128,128,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(joy.x0,joy.y0,60,0,6.283);ctx.stroke();circ(joy.x0+joy.dx*60,joy.y0+joy.dy*60,22,'rgba(128,128,128,.45)')}}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;if(run&&g)upd(dt);draw();requestAnimationFrame(loop)}
cv.addEventListener('pointerdown',e=>{if(joy||!run)return;joy={id:e.pointerId,x0:e.clientX,y0:e.clientY,dx:0,dy:0};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!joy||e.pointerId!==joy.id)return;const dx=e.clientX-joy.x0,dy=e.clientY-joy.y0,l=Math.hypot(dx,dy),m=Math.min(l,60)/60;joy.dx=l?dx/l*m:0;joy.dy=l?dy/l*m:0});
const up=e=>{if(joy&&e.pointerId===joy.id)joy=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key===' ')dash()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
menu();requestAnimationFrame(t=>{last=t;loop(t)});
